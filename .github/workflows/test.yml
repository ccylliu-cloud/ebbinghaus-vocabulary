name: Test print generator
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      VOCAB_XLSX_ENGINE: xlsxwriter
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r skills/ebbinghaus-vocabulary/requirements.txt
      - run: python skills/ebbinghaus-vocabulary/scripts/test_vocab.py
      - run: python tools/package_release.py
